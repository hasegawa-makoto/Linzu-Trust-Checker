<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title data-i18n="optionsTitle">Settings</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background-color: white; border-radius: 8px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        h1 { color: #0056b3; margin-top: 0; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; text-align: left; }
        input[type="text"], select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 16px; font-size: 14px; }
        button { background-color: #0056b3; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: 600; width: 100%; transition: background-color 0.2s; }
        button:hover { background-color: #004494; }
        .explanation { font-size: 13px; color: #666; margin-bottom: 16px; line-height: 1.5; text-align: left; }
        .status-message { margin-top: 16px; font-size: 14px; font-weight: bold; min-height: 20px; }
        .status-message.success { color: #2e7d32; }
        .status-message.error { color: #d32f2f; }
        a { color: #0056b3; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .section { text-align: left; margin-top: 16px; padding-top: 16px; border-top: 1px solid #eee; }

        /* License Specific */
        .license-status { font-weight: bold; margin-bottom: 8px; display: block; }
        .status-active { color: #2e7d32; }
        .status-inactive { color: #d32f2f; }
        .btn-activate { background-color: #28a745; margin-bottom: 12px; }
        .btn-activate:hover { background-color: #218838; }
        .purchase-link { font-size: 12px; margin-top: 8px; display: block; }

        .save-group { display: flex; gap: 8px; align-items: center; }
        .save-group button { width: auto; flex-grow: 1; }
    </style>
</head>
<body>
    <div class="container">
        <h1 data-i18n="optionsTitle"></h1>

        <!-- Language Section (Top) -->
        <div class="section" style="border-top: none; margin-top: 0; padding-top: 0;">
            <label for="languageSelect" data-i18n="optionsLabelLang"></label>
            <select id="languageSelect">
                <option value="ja">日本語 (Japanese)</option>
                <option value="en">English</option>
            </select>
        </div>

        <!-- License Section -->
        <div class="section">
            <label data-i18n="optionsLabelLicense"></label>
            <span id="licenseStatus" class="license-status status-inactive" data-i18n="licenseInactive"></span>

            <input type="text" id="licenseKey" placeholder="XXXX-XXXX-XXXX-XXXX">
            <button id="activateBtn" class="btn-activate" data-i18n="btnActivate"></button>
            <div id="licenseMsg" class="status-message" style="margin-top: 0; margin-bottom: 8px; min-height: 0;"></div>
        </div>

        <!-- API Key Section -->
        <div class="section">
            <label for="apiKey" data-i18n="optionsLabelKey"></label>
            <div class="explanation">
                <span data-i18n="optionsDesc"></span><br>
                <a href="https://aistudio.google.com/app/apikey" target="_blank" data-i18n="optionsGetLink"></a>
            </div>

            <input type="text" id="apiKey" placeholder="AIzaSy...">
            <button id="saveApiKeyBtn" data-i18n="btnSave"></button>
            <div id="apiKeyMsg" class="status-message" style="margin-top: 8px;"></div>
        </div>
    </div>
    <script src="libs/i18n_manager.js"></script>
    <script src="libs/license_manager.js"></script>
    <script src="options.js"></script>
</body>
</html>
