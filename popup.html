<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <header>
        <h1 data-i18n="extName"></h1>
      </header>

      <div id="apiKeyWarning">
        <span data-i18n="warnApiKey"></span><br>
        <a id="openSettingsLink" data-i18n="warnApiKeyLink"></a>
      </div>

      <main>
        <!-- Idle State -->
        <div id="stateIdle" class="state-container visible">
          <div class="idle-icon">🖱️</div>
          <div class="idle-text" data-i18n="statusIdle"></div>
        </div>

        <!-- Analyzing State -->
        <div id="stateAnalyzing" class="state-container">
          <div class="spinner"></div>
          <div class="idle-text" data-i18n="statusAnalyzing"></div>
        </div>

        <!-- Success State -->
        <div id="stateSuccess" class="state-container">
          <div class="result-card">
            <img id="resultThumb" class="result-thumb" src="">

            <div class="prob-label" data-i18n="ai_probability_label"></div>
            <div id="resultProb" class="prob-value">--%</div>

            <div id="resultType" class="type-badge">Unknown</div>

            <ul id="resultReasons" class="reasons-list"></ul>
          </div>
        </div>

        <!-- Error State -->
        <div id="stateError" class="state-container">
          <div class="error-icon">⚠️</div>
          <div id="errorMsg" class="error-msg" data-i18n="statusError"></div>
          <div id="errorDetail" class="error-detail"></div>
        </div>
      </main>

      <footer>
        <button id="settingsBtn" class="settings-btn" data-i18n="btnSettings">
          ⚙️
        </button>
      </footer>
    </div>
    <script src="libs/i18n_manager.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
