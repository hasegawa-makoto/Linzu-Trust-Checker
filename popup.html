<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Linzu</h1>
      </header>

      <div id="apiKeyWarning">
        APIキーが設定されていません。<br>
        <a id="openSettingsLink">設定画面を開く</a>
      </div>

      <main>
        <!-- Idle State -->
        <div id="stateIdle" class="state-container visible">
          <div class="idle-icon">🖱️</div>
          <div class="idle-text">
            解析したい画像を<br><strong>右クリック</strong>して<br>「Linzuで解析」を選択してください
          </div>
        </div>

        <!-- Analyzing State -->
        <div id="stateAnalyzing" class="state-container">
          <div class="spinner"></div>
          <div class="idle-text">AIが画像を解析中...</div>
        </div>

        <!-- Success State -->
        <div id="stateSuccess" class="state-container">
          <div class="result-card">
            <img id="resultThumb" class="result-thumb" src="">

            <div class="prob-label">AI生成確率</div>
            <div id="resultProb" class="prob-value">--%</div>

            <div id="resultType" class="type-badge">Unknown</div>

            <ul id="resultReasons" class="reasons-list"></ul>
          </div>
        </div>

        <!-- Error State -->
        <div id="stateError" class="state-container">
          <div class="error-icon">⚠️</div>
          <div id="errorMsg" class="error-msg">エラーが発生しました</div>
          <div id="errorDetail" class="error-detail"></div>
        </div>
      </main>

      <footer>
        <button id="settingsBtn" class="settings-btn">
          ⚙️ 設定
        </button>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
