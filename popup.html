<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Linzu</h1>
      </header>
      <main>
        <button id="scanButton">現在のページをスキャン</button>

        <div id="errorContainer" style="display: none;"></div>

        <div id="result" style="display: none;">
          <div id="statusContainer">
             <div id="warningMark" class="warning-icon"></div>
             <p id="imageCount" class="status-text"></p>
          </div>

          <div id="aiProbabilityContainer" style="display: none;">
            <p class="prob-label">AI生成確率</p>
            <div id="aiProbability" class="prob-value"></div>
          </div>

          <div id="detailsContainer" style="display: none;">
            <ul id="detailsList"></ul>
          </div>
        </div>
      </main>
    </div>
    <script src="libs/api_client.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
